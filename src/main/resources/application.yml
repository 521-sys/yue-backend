# 粤语学习后端配置
# 数据库需先建：CREATE DATABASE yue DEFAULT CHARACTER SET utf8mb4;
# 敏感配置（密码/密钥）绝不写在本文件：
#   - 本机开发：项目根 config/application-local.yml（已被 .gitignore 忽略，不进 Git、不打进 jar）
#   - 生产部署：通过环境变量注入（MYSQL_PASSWORD / JWT_SECRET / WX_APPID / WX_SECRET）
server:
  port: 8080

spring:
  servlet:
    multipart:
      file-size-threshold: 0
      max-file-size: 200MB
      max-request-size: 201MB
      resolve-lazily: true
  profiles:
    # 本机默认激活 local（读取 config/application-local.yml）；生产部署设环境变量 SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/yue?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    # 无明文默认值：由 config/application-local.yml（本机）或环境变量 MYSQL_PASSWORD（部署）提供
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 首次启动自动建表；稳定后建议改为 validate 或 none
      ddl-auto: update
    # 关闭 open-in-view，避免视图渲染期持有数据库连接
    open-in-view: false
    show-sql: false
  jackson:
    default-property-inclusion: non_null

app:
  dubbing-asr:
    enabled: ${DUBBING_ASR_ENABLED:false}
    secret-id: ${TENCENTCLOUD_SECRET_ID:}
    secret-key: ${TENCENTCLOUD_SECRET_KEY:}
    monthly-seconds: ${DUBBING_ASR_MONTHLY_SECONDS:600}
    budget-file: ${DUBBING_ASR_BUDGET_FILE:./data/dubbing-asr-budget.txt}
    ffmpeg: ${DUBBING_FFMPEG:ffmpeg}
    ffprobe: ${DUBBING_FFPROBE:ffprobe}
  sms:
    enabled: ${SMS_ENABLED:false}
    code-pepper: ${SMS_CODE_PEPPER:}
    expiry-seconds: ${SMS_EXPIRY_SECONDS:300}
    cooldown-seconds: ${SMS_COOLDOWN_SECONDS:60}
    phone-daily-limit: ${SMS_PHONE_DAILY_LIMIT:10}
    ip-daily-limit: ${SMS_IP_DAILY_LIMIT:30}
    max-failures: ${SMS_MAX_FAILURES:5}
    cleanup-cron: ${SMS_CLEANUP_CRON:0 15 3 * * *}
    trusted-proxy-addresses: ${SMS_TRUSTED_PROXY_ADDRESSES:127.0.0.1,::1}
    tencent:
      secret-id: ${SMS_TENCENT_SECRET_ID:}
      secret-key: ${SMS_TENCENT_SECRET_KEY:}
      sdk-app-id: ${SMS_TENCENT_SDK_APP_ID:}
      sign-name: ${SMS_TENCENT_SIGN_NAME:}
      template-id: ${SMS_TENCENT_TEMPLATE_ID:}
      region: ${SMS_TENCENT_REGION:ap-guangzhou}
  cors:
    # 部署到公网后用环境变量 CORS_ORIGINS 覆盖（逗号分隔），如 https://yue.example.com
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    # 无明文默认值：本机由 config/application-local.yml 提供；生产必须设环境变量 JWT_SECRET（openssl rand -base64 48）
    secret: ${JWT_SECRET:}
    # token 有效期：24 小时（毫秒）
    expiration-ms: 86400000
  wechat:
    # 小程序 AppID / AppSecret。留空 = 开发模式（按 code 模拟 openid），不能正式发布
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}

admin:
  audio-dir: ${ADMIN_AUDIO_DIR:./data/admin-audio}
  username: ${ADMIN_USERNAME:admin}
  password-hash: ${ADMIN_PASSWORD_HASH:}

logging:
  level:
    com.yue: info
    org.hibernate.SQL: warn

